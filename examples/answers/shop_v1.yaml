# shop_v1.yaml の問い（python -m specgap questions examples/shop_v1.yaml）への答え。
# 人が会話で答えた内容を、AI がこの形に書き写す想定。正本（YAML）そのものは人も AI も手で直さない。
name: 通販の返品（問いに答えた版）
answers:
  # 1〜4 は表の根底のルールの問い。ここでは穴に直接答えるので、ルールの問いには答えない
  # （穴が埋まればルールの問いは消える）。ルールから聞く流れは ask / reply を参照
  5: {返金額: 支払額 // 2}
  6: {返金額: 支払額 // 2}
  7: {返金額: 0}
  8: 拒否：発送済み
  9: 拒否：発送済み
  10: 拒否：発送後のキャンセルは返品で受け付ける
  11: タイムアウトと同じ扱いにする
  12: 1時間後に再送し、3回失敗したら担当者に通知する
  13: 注文番号
  14: 渡さない
  15: 購入者が返品の内容と返金額の見込みを確認する
  16: 倉庫システムに注文番号で集荷依頼の有無を照会し、あれば続きから再開する
  17: 待つ
  18: サポート担当が返金額を確認して承認する
  19: 決済代行に注文番号で返金状況を照会し、返金済みなら状態の更新から再開する
  # 20（返金完了メールの前の確認）は、確認なしで送ってよいので答えない
