# 返金の仕様（修正後）。検査器の問いに答えて漏れを埋めた版。
spec: 返金（修正後）

enums:
  商品状態: [未開封, 開封済み]
  支払方法: [カード, ポイント, 銀行振込]
  返金方法: [元の支払方法, ポイント付与]

inputs:
  経過日数: {type: int, min: 0, max: 3650, description: 購入日からの経過日数}
  商品状態: {type: 商品状態}
  支払額: {type: int, min: 1, max: 1000000, description: 円}
  支払方法: {type: 支払方法}

outputs:
  返金額: {type: int, min: 0}
  返金方法: {type: 返金方法}

tables:
  - id: 返金額の決定
    rows:
      - when: 経過日数 <= 30 and 商品状態 == 未開封
        then: {返金額: 支払額}
      - when: 経過日数 <= 30 and 商品状態 == 開封済み
        then: {返金額: 支払額 // 2}
      - when: 経過日数 > 30
        then: {返金額: 0}

  - id: 返金方法の決定
    rows:
      - when: 支払方法 == カード
        then: {返金方法: 元の支払方法}
      - when: 支払方法 == ポイント
        then: {返金方法: ポイント付与}
      - when: 支払方法 == 銀行振込
        then: {返金方法: unspecified}

ensures:
  - id: 返金は支払額を超えない
    expr: 0 <= 返金額 <= 支払額
