    question: （問いによらない変更）
    answer: 担当者への知らせは必ず通知欄に載せ、メールで送るかは統一ルールの表で決める
    said: メール通知に対しての統一ルールを決め、そのルールに従って送る送らないの判断をしたい。仮にそのルールで送らないになっても、画面上の通知欄で確認可能にしたい。／2を指針としつつ、例外も認めて基本的に1／はい。それでok顧客影響があり、早めに顧客に伝える必要のあるものが送る。そうではないものはオペレーション都合に寄るみたいなかんじになってればおーけーです
    assumptions:
      - 指針（顧客に影響があり早めに伝える必要があるものは送る）は性質として検査する。それ以外の行は運用の都合で決めてよい
      - 通知欄への掲載は社内の同じ仕組みへの書き込みなので失敗しない前提にする
      - メールが送れなかったときは通知欄に未送信と出し、再送はしない（AI の案に人が異を唱えなかった）
    applies_to:
