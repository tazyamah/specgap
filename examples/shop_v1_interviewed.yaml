# 通販の返品（修正前）。ユースケース・画面・決まりごと・状態・システム間連携をひとつにまとめた正本。
spec: 通販の返品（会話で答えた版）

actors:
  購入者: 商品を買った人
  サポート担当: 返品の問い合わせに対応する社員

  管理者: 不正な注文を確かめ、処理する社員
usecases:
  - id: 注文する
    actor: 購入者
    uses: [注文]
  - id: 返品を申し込む
    actor: 購入者
    description: 届いた商品を返品し、返金を受ける
    uses: [返金額の決定, 注文, 返品を受け付ける]
  - id: 返金を承認する
    actor: サポート担当
    uses: [返金を実行]
  - id: 不正な注文を確かめる
    actor: 管理者
    description: 発送済みの注文に届いた支払を、不正な注文として確かめる
    uses:
      - 不正な支払を記録する

screens:
  - id: 購入者の画面
    start: 商品一覧
    transitions:
      - {from: 商品一覧, action: 購入する, to: 注文確認, usecase: 注文する}
      - {from: 注文確認, action: 確定する, to: 注文一覧}
      - {from: 注文確認, action: やめる, to: 商品一覧}
      - {from: 注文一覧, action: 注文を選ぶ, to: 注文詳細}
      - {from: 注文詳細, action: 戻る, to: 注文一覧}
      - {from: 注文詳細, action: 返品を申し込む, to: 返品申込, usecase: 返品を申し込む}
      - {from: 返品申込, action: 申し込む, to: 申込完了}
  - id: サポート担当の画面
    start: 返品依頼一覧
    final: [承認完了]
    transitions:
      - {from: 返品依頼一覧, action: 依頼を開く, to: 返品依頼詳細}
      - {from: 返品依頼詳細, action: 返金を承認する, to: 承認完了, usecase: 返金を承認する}

enums:
  商品状態: [未開封, 開封済み]

inputs:
  経過日数: {type: int, min: 0, max: 3650, description: 購入日からの経過日数}
  商品状態: {type: 商品状態}
  支払額: {type: int, min: 1, max: 1000000, example: 10000, description: 円}

outputs:
  返金額: {type: int, min: 0, description: 円}

tables:
  - id: 返金額の決定
    rows:
      - when: 経過日数 < 30 and 商品状態 == 未開封
        then: {返金額: 支払額}
      - when: 経過日数 < 30 and 商品状態 == 開封済み
        then: {返金額: 支払額 // 2}
      - when: 経過日数 > 30 and 商品状態 == 未開封
        then: {返金額: 0}
      - when: 経過日数 == 30 and 商品状態 == 未開封
        then: {返金額: 支払額}
      - when: 経過日数 == 30 and 商品状態 == 開封済み
        then: {返金額: 支払額 // 2}
      - when: 経過日数 >= 31 and 商品状態 == 開封済み
        then: {返金額: 0}

ensures:
  - id: 返金は支払額を超えない
    expr: 0 <= 返金額 <= 支払額

machines:
  - id: 注文
    states: [受付, 支払済み, 発送済み, 完了, キャンセル済み]
    events: [支払, 発送, 到着, キャンセル]
    initial: 受付
    final: [完了, キャンセル済み]
    transitions:
      - {from: 受付, on: 支払, to: 支払済み}
      - {from: 受付, on: キャンセル, to: キャンセル済み}
      - {from: 支払済み, on: 発送, to: 発送済み}
      - {from: 支払済み, on: キャンセル, to: キャンセル済み}
      - {from: 発送済み, on: 到着, to: 完了}
      - {from: 発送済み, on: 支払, to: 発送済み}
      - {from: 発送済み, on: 発送, to: 発送済み}
    rejects:
      - {from: 受付, on: [発送, 到着], reason: 支払前}
      - {from: 支払済み, on: [支払, 到着], reason: 二重支払・未発送}
      - {from: [完了, キャンセル済み], on: [支払, 発送, 到着, キャンセル], reason: 終了済み}
      - {from: 発送済み, on: キャンセル, reason: 発送後のキャンセルは返品で受け付ける}

systems:
  決済代行: {description: カード決済と返金を行う外部サービス}
  メール配信: {description: 購入者へのメールを送る外部サービス}
  倉庫システム: {description: 集荷と在庫を扱う社内の別システム, kind: 社内}
  社内通知: {description: 管理者や担当者に知らせを送る社内の仕組み, kind: 社内}

data:
  classes: [一般, 個人情報, 決済情報]
  items:
    注文番号: 一般
    返金額: 一般
    返金ID: 一般
    集荷番号: 一般
    決済ID: 決済情報
    氏名: 個人情報
    メールアドレス: 個人情報
    住所: 個人情報
    カード番号: 個人情報  # 決済IDからはたどれても、カード番号そのものは個人情報として扱う
  allow:
    決済代行: [一般, 決済情報]
    メール配信: [一般, 個人情報]
    倉庫システム: [一般, 個人情報]
    社内通知: [一般, 決済情報]
effects:
  決済API:
    system: 決済代行
    mode: sync
    sends: [注文番号, 返金額, 決済ID]
    receives: [返金ID]
    reversible: no
    failures: [タイムアウト, 拒否, 通信エラー]
    idempotency: 注文番号
  返金完了メール:
    system: メール配信
    mode: async
    sends: [メールアドレス, 氏名, 返金額]
    reversible: no
    idempotency: 注文番号
    failures: [送信失敗]
  # 前提：倉庫システムと決済代行は、注文番号が同じ2回目の依頼を断れること（仕様の外で確かめる）。
  # 前提：1つの注文につき集荷と返金は1回まで（取り消し後の再返品や、一部ずつの返品は扱わない）。
  集荷依頼:
    system: 倉庫システム
    mode: async
    sends: [注文番号, 氏名, 住所]
    receives: [集荷番号]
    reversible: compensate
    compensate: 集荷の取消
    idempotency: 注文番号
    failures: [受付拒否]
  集荷の取消:
    system: 倉庫システム
    mode: sync
    sends: [集荷番号]
    reversible: no
    idempotency: 集荷番号
    failures: [取消不可]
  不正な注文の通知:
    system: 社内通知
    mode: async
    sends:
      - 注文番号
      - 決済ID
    reversible: no
    idempotency: 決済ID
    failures:
      - 送信失敗

  重複した発送の通知:
    system: 社内通知
    mode: async
    sends:
      - 注文番号
    reversible: no
    idempotency: 注文番号
    failures:
      - 送信失敗
  集荷依頼の照会:
    system: 倉庫システム
    mode: sync
    sends:
      - 注文番号
    receives:
      - 集荷番号
    reversible: yes
    failures:
      - タイムアウト
      - 通信エラー
  返金状況の照会:
    system: 決済代行
    mode: sync
    sends:
      - 注文番号
    receives:
      - 返金ID
    reversible: yes
    failures:
      - タイムアウト
      - 通信エラー
operations:
  - id: 返品を受け付ける
    uses:
      - 集荷依頼の照会
    steps:
      - {confirm: 購入者が返品の内容を確認する}
      - {update: 注文を返品処理中にする}
      - send: 集荷依頼
      - {await: 集荷依頼}
      - update: 注文を返品待ちにする
    on_failure:
      集荷依頼.受付拒否: サポート担当に通知する
      集荷依頼の照会.タイムアウト: 保留にして時間をおいて照会し直し、何度もできなければ担当者に通知する
      集荷依頼の照会.通信エラー: 保留にして時間をおいて照会し直し、何度もできなければ担当者に通知する
    on_interrupt: 担当者が、処理中のまま残った注文を見つけて再開する。倉庫に注文番号で集荷依頼を照会し、通っていれば続きから、通っていなければ集荷依頼からやり直す。照会できなければ保留にして時間をおいて照会し直し、何度もできなければ担当者に通知する
  - id: 返金を実行
    uses:
      - 返金状況の照会
    steps:
      - {confirm: サポート担当が返金額を確認して承認する}
      - {update: 承認した返金額を記録し、注文を返金処理中にする}
      - call: 決済API
      - update: 注文を返金済みにする
      - send: 返金完了メール
    on_failure:
      決済API.タイムアウト: 照会してから再試行し、未確定なら保留にする
      決済API.拒否: 返金失敗として記録し、担当者に通知する
      決済API.通信エラー: 決済代行に返金済みかどうかを照会し、返金済みでなければ再試行、返金済みならそのまま進める。エラーが起きて照会しつつ再試行したことはログに残す
      返金完了メール.送信失敗: 送れなかったことを記録するだけにする（購入者は画面で返金を確かめられる）
      返金状況の照会.タイムアウト: 保留にして時間をおいて照会し直し、何度もできなければ担当者に通知する
      返金状況の照会.通信エラー: 保留にして時間をおいて照会し直し、何度もできなければ担当者に通知する
    on_interrupt: 担当者が、処理中のまま残った注文を見つけて再開する。決済代行に注文番号で返金状況を照会し、返金済みなら続きから、まだなら記録した承認額で返金依頼からやり直す。照会できなければ保留にして時間をおいて照会し直し、何度もできなければ担当者に通知する
  - id: 不正な支払を記録する
    steps:
      - {update: 不正な注文を作り、届いた支払をその注文に登録する}
      - {send: 不正な注文の通知}
    on_failure:
      不正な注文の通知.送信失敗: 時間をおいて再送し、何度か失敗したらメールで知らせる。メールの件名には注文番号など、どの注文か特定できる文言を入れる
  - id: 重複した発送を記録する
    steps:
      - {update: 注文の備考欄に、発送の知らせが重ねて届いたことを記載する}
      - {send: 重複した発送の通知}
    on_failure:
      重複した発送の通知.送信失敗: 時間をおいて再送し、何度か失敗したらメールで知らせる。メールの件名には注文番号など、どの注文か特定できる文言を入れる
rules:
  - {id: 経過日数が増えると返金額は増えない, output: 返金額, by: 経過日数, trend: 減る}
  - {id: 商品状態が進むと返金額は増えない, output: 返金額, by: 商品状態, trend: 減る}
  - {id: 開封済みの返金額は未開封のときの半分, output: 返金額, by: 商品状態, from: 未開封, to: 開封済み, then: 返金額 // 2}
  - {id: 経過日数が30のときは29と同じ扱い, output: 返金額, by: 経過日数, from: 29, to: 30, then: 同じ}
