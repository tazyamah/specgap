# 返金の仕様（修正前）。漏れが残っている版。
spec: 返金（修正前）

enums:
  商品状態: [未開封, 開封済み]
  配送方法: [通常, 速達]

inputs:
  経過日数: {type: int, min: 0, max: 3650, description: 購入日からの経過日数}
  商品状態: {type: 商品状態}
  支払額: {type: int, min: 1, max: 1000000, description: 円}
  配送方法: {type: 配送方法}

outputs:
  返金額: {type: int, min: 0}

tables:
  - id: 返金額の決定
    rows:
      - when: 経過日数 < 30 and 商品状態 == 未開封
        then: {返金額: 支払額}
      - when: 経過日数 < 30 and 商品状態 == 開封済み
        then: {返金額: 支払額 // 2}
      - when: 経過日数 > 30 and 商品状態 == 未開封
        then: {返金額: 0}

ensures:
  - id: 返金は支払額を超えない
    expr: 0 <= 返金額 <= 支払額
