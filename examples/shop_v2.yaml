# 通販の返品（修正後）。検査器の問いに答えて漏れを埋め、全額返金の期間を14日に短くし、決済代行に氏名を渡さないようにした版。
spec: 通販の返品（修正後）

actors:
  購入者: 商品を買った人
  サポート担当: 返品の問い合わせに対応する社員

usecases:
  - id: 注文する
    actor: 購入者
    uses: [注文]
  - id: 返品を申し込む
    actor: 購入者
    description: 届いた商品を返品し、返金を受ける
    uses: [返金額の決定, 返金方法の決定, 注文, 返品を受け付ける]
  - id: 返金状況を確認する
    actor: 購入者
  - id: 返金を承認する
    actor: サポート担当
    uses: [返金を実行]

screens:
  - id: 購入者の画面
    start: 商品一覧
    transitions:
      - {from: 商品一覧, action: 購入する, to: 注文確認, usecase: 注文する}
      - {from: 注文確認, action: 確定する, to: 注文一覧}
      - {from: 注文確認, action: やめる, to: 商品一覧}
      - {from: 注文一覧, action: 注文を選ぶ, to: 注文詳細}
      - {from: 注文詳細, action: 戻る, to: 注文一覧}
      - {from: 注文詳細, action: 返品を申し込む, to: 返品申込, usecase: 返品を申し込む}
      - {from: 返品申込, action: 申し込む, to: 申込完了}
      - {from: 申込完了, action: 返金状況を見る, to: 返金状況, usecase: 返金状況を確認する}
      - {from: 返金状況, action: 注文一覧へ, to: 注文一覧}
  - id: サポート担当の画面
    start: 返品依頼一覧
    final: [承認完了]
    transitions:
      - {from: 返品依頼一覧, action: 依頼を開く, to: 返品依頼詳細}
      - {from: 返品依頼詳細, action: 返金を承認する, to: 承認完了, usecase: 返金を承認する}

enums:
  商品状態: [未開封, 開封済み]
  支払方法: [カード, ポイント, 銀行振込]
  返金方法: [元の支払方法, ポイント付与]

inputs:
  経過日数: {type: int, min: 0, max: 3650, description: 購入日からの経過日数}
  商品状態: {type: 商品状態}
  支払額: {type: int, min: 1, max: 1000000, example: 10000, description: 円}
  支払方法: {type: 支払方法}

outputs:
  返金額: {type: int, min: 0, description: 円}
  返金方法: {type: 返金方法}

tables:
  - id: 返金額の決定
    rows:
      - when: 経過日数 <= 14 and 商品状態 == 未開封
        then: {返金額: 支払額}
      - when: 経過日数 <= 30 and 商品状態 == 開封済み
        then: {返金額: 支払額 // 2}
      - when: 14 < 経過日数 <= 30 and 商品状態 == 未開封
        then: {返金額: 支払額 // 2}
      - when: 経過日数 > 30
        then: {返金額: 0}

  - id: 返金方法の決定
    rows:
      - when: 支払方法 == カード
        then: {返金方法: 元の支払方法}
      - when: 支払方法 == ポイント
        then: {返金方法: ポイント付与}
      - when: 支払方法 == 銀行振込
        then: {返金方法: unspecified}

ensures:
  - id: 返金は支払額を超えない
    expr: 0 <= 返金額 <= 支払額

machines:
  - id: 注文
    states: [受付, 支払済み, 発送済み, 返品待ち, 完了, キャンセル済み]
    events: [支払, 発送, 到着, キャンセル]
    initial: 受付
    final: [完了, キャンセル済み]
    transitions:
      - {from: 受付, on: 支払, to: 支払済み}
      - {from: 受付, on: キャンセル, to: キャンセル済み}
      - {from: 支払済み, on: 発送, to: 発送済み}
      - {from: 支払済み, on: キャンセル, to: キャンセル済み}
      - {from: 発送済み, on: 到着, to: 完了}
      - {from: 発送済み, on: キャンセル, to: 返品待ち}
      - {from: 返品待ち, on: 到着, to: キャンセル済み}
    rejects:
      - {from: 受付, on: [発送, 到着], reason: 支払前}
      - {from: 支払済み, on: [支払, 到着], reason: 二重支払・未発送}
      - {from: 発送済み, on: [支払, 発送], reason: 発送済み}
      - {from: 返品待ち, on: [支払, 発送, キャンセル], reason: 返品処理中}
      - {from: [完了, キャンセル済み], on: [支払, 発送, 到着, キャンセル], reason: 終了済み}

systems:
  決済代行: {description: カード決済と返金を行う外部サービス}
  メール配信: {description: 購入者へのメールを送る外部サービス}
  倉庫システム: {description: 集荷と在庫を扱う社内の別システム, kind: 社内}

data:
  classes: [一般, 個人情報, 決済情報]
  items:
    注文番号: 一般
    返金額: 一般
    返金ID: 一般
    集荷番号: 一般
    決済ID: 決済情報
    氏名: 個人情報
    メールアドレス: 個人情報
    住所: 個人情報
  allow:
    決済代行: [一般, 決済情報]
    メール配信: [一般, 個人情報]
    倉庫システム: [一般, 個人情報]

effects:
  決済API:
    system: 決済代行
    mode: sync
    sends: [注文番号, 返金額, 決済ID]
    receives: [返金ID]
    reversible: no
    idempotency: 注文番号
    failures: [タイムアウト, 拒否, 通信エラー]
  返金完了メール:
    system: メール配信
    mode: async
    sends: [メールアドレス, 氏名, 返金額]
    reversible: no
    idempotency: 注文番号
    failures: [送信失敗]
  集荷依頼:
    system: 倉庫システム
    mode: async
    sends: [注文番号, 氏名, 住所]
    receives: [集荷番号]
    reversible: compensate
    compensate: 集荷の取消
    idempotency: 注文番号
    failures: [受付拒否]
  集荷の取消:
    system: 倉庫システム
    mode: sync
    sends: [集荷番号]
    reversible: no
    idempotency: 集荷番号
    failures: [取消不可]

operations:
  - id: 返品を受け付ける
    steps:
      - confirm: 購入者が返品の内容と返金額の見込みを確認する
      - send: 集荷依頼
      - await: 集荷依頼
      - update: 注文を返品待ちにする
    on_interrupt: 倉庫システムに注文番号で集荷依頼の有無を照会し、あれば続きから再開する
    on_failure:
      集荷依頼.受付拒否: 申込を差し戻し、購入者に理由を表示する
  - id: 返金を実行
    steps:
      - confirm: サポート担当が返金額を確認して承認する
      - call: 決済API
      - update: 注文を返金済みにする
      - send: 返金完了メール
    on_interrupt: 決済代行に注文番号で返金状況を照会し、返金済みなら状態の更新から再開する
    on_failure:
      決済API.タイムアウト: 照会してから再試行し、未確定なら保留にする
      決済API.拒否: 返金失敗として記録し、担当者に通知する
      決済API.通信エラー: タイムアウトと同じ扱いにする
      返金完了メール.送信失敗: 1時間後に再送し、3回失敗したら担当者に通知する

# 実装との対応。関数は仕様の入力名を引数で受け、出力（1つなら値そのもの）を返す。状態機械は (状態, 出来事) を受けて次の状態を返し、None は拒否
implementation:
  module: impl/shop_impl.py
  tables:
    返金額の決定: refund_amount
    返金方法の決定: refund_method
  machines:
    注文: next_order_state

# 項目ごとに必要な保証。届かない実装は受け入れない
policy:
  default: テスト済み
  返金額の決定: 証明済み
  注文: 証明済み
  返金は支払額を超えない: 証明済み
  返金方法の決定: テスト済み＋監視
